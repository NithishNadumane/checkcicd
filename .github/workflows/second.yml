name: Real Dev CI Demo

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:

      # STEP 1: CHECKOUT CODE
      - name: Checkout Code
        uses: actions/checkout@v4

      # STEP 2: INSTALL DEPENDENCIES (SIMULATED)
      - name: Install Dependencies
        run: |
          echo "Installing Java dependencies -> mvn install"
          echo "Installing Node dependencies -> npm install"
          echo "Installing Python dependencies -> pip install"
          echo "Dependencies installed."

      # STEP 3: LINT (SIMULATED)
      - name: Lint Code
        run: |
          echo "Running linter..."
          echo "Lint completed successfully."

      # STEP 4: BUILD (SIMULATED)
      - name: Build Project
        run: |
          echo "Building project..."
          echo "Java -> mvn clean package"
          echo "Node -> npm run build"
          echo "Python -> python setup.py build"
          echo "Build completed successfully."

      # STEP 5: TEST (SIMULATED)
      - name: Run Tests
        run: |
          echo "Running unit tests..."
          echo "All tests passed successfully."

      # STEP 6: PACKAGE ARTIFACT
      - name: Package Artifacts
        run: |
          echo "Packaging build artifacts..."
          mkdir -p build
          echo "Sample build artifact" > build/app.txt
          echo "Artifact created."

      # STEP 7: UPLOAD ARTIFACT
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/

      # STEP 8: DOCKER BUILD (SIMULATED)
      - name: Build Docker Image
        run: |
          echo "Building Docker image..."
          echo "docker build -t myapp:latest ."
          echo "Docker image built successfully."

      # STEP 9: DOCKER PUSH (SIMULATED)
      - name: Push Docker Image
        run: |
          echo "Logging into Docker registry..."
          echo "docker push myapp:latest"
          echo "Docker image pushed successfully."

      # STEP 10: FINAL STATUS
      - name: Final Status
        run: echo "CI pipeline finished successfully."